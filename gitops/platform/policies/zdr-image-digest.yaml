# P5 (DRF-67, SPEC-P5 D6, D8, D9). Validate only, Pods in namespaces that
# carry rag.zero-drift.io/tenant. Deny: switched from Audit in the P5 L3 window
# (P5-T4.2 C) after the Audit policy reports were clean. failurePolicy Fail (D8):
# if Kyverno is down, tenant Pods are refused; platform namespaces are outside
# the selector, so teardown still works. No PolicyException (D9).
# Autogen is off: kro-created Deployments are judged by their Pods.
# Threat T14. Only the project registry path, only by digest.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: zdr-image-digest
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: rag.zero-drift.io/tenant
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.image.startsWith('ghcr.io/eurusdevsec/zero-d-rift/')
          && c.image.matches('@sha256:[0-9a-f]{64}$'))
      message: "image must come from ghcr.io/eurusdevsec/zero-d-rift/ and be pinned by @sha256 (SPEC-P5 D6)"
