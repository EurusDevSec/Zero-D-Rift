# Wave 3: extra rights aggregated into kro (children + the generated kind).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zdr-kro-rbac
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/EurusDevSec/Zero-D-Rift.git
    targetRevision: main
    path: gitops/platform/kro-rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: kro-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
