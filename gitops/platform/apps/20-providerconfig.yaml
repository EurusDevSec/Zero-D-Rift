# Wave 2: ClusterProviderConfig "default" with credentials from IRSA.
# Its CRD comes from the provider (wave 1): SkipDryRunOnMissingResource + retry.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zdr-providerconfig
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/EurusDevSec/Zero-D-Rift.git
    targetRevision: main
    path: gitops/platform/providerconfig
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
