# Wave 9: user requests. Unlike the platform apps this one PRUNES: removing an
# instance from Git deletes it (and, through kro and Crossplane, its bucket).
# allowEmpty lets the last instance be removed. Only files directly in
# gitops/requests are synced; gitops/requests/disabled/ is ignored until a file
# is moved up (negative test, Task 5).
# P5 (DRF-66, SPEC-P5 D4): project zdr-requests (85-project-requests.yaml) limits
# this app to RAGSandbox in tenant-a/tenant-b. Every request names its own
# namespace, so the destination namespace is only the default; it must be one
# the project allows. No CreateNamespace: the project allows no Namespace, and
# the tenant namespaces come from zdr-tenants (wave 2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zdr-requests
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: zdr-requests
  source:
    repoURL: https://github.com/EurusDevSec/Zero-D-Rift.git
    targetRevision: main
    path: gitops/requests
    # No directory.recurse: the default (false) already ignores requests/disabled/.
    # Writing recurse: false kept zdr-root OutOfSync, because Argo drops the
    # default value when it stores the Application (L3 window 05/11).
  destination:
    server: https://kubernetes.default.svc
    namespace: tenant-a
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
