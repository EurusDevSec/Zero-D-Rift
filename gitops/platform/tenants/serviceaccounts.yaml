# P4 (DRF-51, SPEC-P4 negative boundary 3, D4). The two platform identities live
# only in zdr-platform. Their IRSA role ARN annotations hold the account ID, so
# the window adds them with kubectl from Terraform outputs (runbook P4 window);
# the Application ignores that field, as in P3.
#   rag-db-admin  -> zero-drift-rag-db-admin   (db-init: master secret, writes bootstrap secret)
#   rag-bootstrap -> zero-drift-rag-bootstrap  (bootstrap Jobs: bootstrap secret, tenant secrets)
# No Kubernetes API token: the Jobs only call AWS and PostgreSQL. The EKS
# webhook mounts its own web identity token for IRSA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-db-admin
  namespace: zdr-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-bootstrap
  namespace: zdr-platform
automountServiceAccountToken: false
---
# P5 (DRF-66, SPEC-P5 D2): the default ServiceAccount of each tenant namespace
# mounts no Kubernetes API token. Tenant apps never call the API (A9); IRSA
# keeps its own projected token on the sandbox ServiceAccount rag-<name>.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tenant-a
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tenant-b
automountServiceAccountToken: false
