# P3 kind lab (DRF-39) E3 step 2: a ClusterProviderConfig that points at a
# Secret that does not exist. Still no credentials, nothing reaches AWS, but the
# Bucket now reports Synced=False with a readable error.
apiVersion: aws.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds-does-not-exist
      key: credentials
