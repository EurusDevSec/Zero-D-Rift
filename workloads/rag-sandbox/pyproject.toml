[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ragsandbox"
version = "0.1.0"
description = "Zero D-Rift RAGSandbox reference workload: db-init, bootstrap, cleanup, serve"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs a PostgreSQL with pgvector (RAG_TEST_PG_HOST)"]
